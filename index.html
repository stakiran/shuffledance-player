<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シャッフルダンス譜面</title>
<style>
  :root {
    --paper: #eef0f2;
    --panel: #ffffff;
    --ink: #1c2430;
    --mute: #6b7480;
    --line: #d5d9de;
    --accent: #1f5fbf;
    --accent-ink: #ffffff;
    --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 16px 12px 48px;
  }
  .app { width: 100%; max-width: 560px; display: grid; gap: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }

  /* 譜面 */
  .chart { padding: 12px 12px 14px; display: grid; gap: 10px; }
  .chart .status { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; padding: 0 4px; }
  .beats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 45%; }
  .beats span { height: 6px; border-radius: 3px; background: var(--line); }
  .beats span:nth-child(5) { margin-left: 4px; }
  .beats span.on { background: var(--accent); }
  canvas { display: block; width: 100%; height: clamp(360px, 62vh, 720px); border-radius: 10px; background: #fafbfc; border: 1px solid var(--line); touch-action: none; }

  /* 操作 */
  .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .controls button {
    font: inherit; font-size: 12px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 10px; padding: 10px 4px 8px;
    display: grid; justify-items: center; gap: 4px;
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .controls button svg { width: 20px; height: 20px; fill: currentColor; }
  .controls button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .controls .play { background: var(--ink); color: #fff; border-color: var(--ink); }

  .settings { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--mute); border-top: 1px solid var(--line); padding-top: 12px; }
  .settings label { display: flex; align-items: center; gap: 6px; }
  .settings input[type=number], .settings select {
    font: inherit; width: 6.5em; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--panel);
  }
  .settings select { width: auto; }
  .settings button {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 7px 10px; cursor: pointer; touch-action: manipulation;
  }
  .settings .grp { display: inline-flex; gap: 4px; }
  .settings button:focus-visible, .settings input:focus-visible, .settings select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .bpms { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px; }
  .bpms:empty { display: none; }
  .bpms button {
    font: inherit; font-size: 13px; font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 5px 11px; cursor: pointer; touch-action: manipulation;
  }
  .bpms button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .bpms button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 遠目モード: 譜面だけを全画面に広げる。操作は画面をタップしたときだけ下に出す */
  .farbar { display: none; }
  body.far { padding: 0; overflow: hidden; }
  body.far .chart { position: fixed; inset: 0; padding: 0; gap: 0; border: 0; border-radius: 0; background: #fafbfc; }
  body.far .status, body.far .settings, body.far .bpms { display: none; }
  body.far canvas { height: 100dvh; border: 0; border-radius: 0; }
  body.far .controls, body.far .farbar {
    display: none; position: fixed; left: 0; right: 0; z-index: 1;
    padding: 10px 12px; background: rgba(255,255,255,0.92); border-top: 1px solid var(--line);
  }
  body.far .controls { bottom: 0; }
  body.far .farbar { bottom: 90px; gap: 8px; align-items: center; justify-content: center; font-size: 15px; color: var(--mute); border-top: 0; }
  body.far.ui .controls { display: grid; }
  body.far.ui .farbar { display: flex; }
  body.far .controls button { font-size: 14px; padding: 12px 4px 10px; }
  .farbar button, .farbar select {
    font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 9px 14px; cursor: pointer; touch-action: manipulation;
  }
  .farbar select { background: var(--panel); }
  .farbar label { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<main class="app">

  <section class="chart">
    <div class="status">
      <span id="stText"></span>
      <div class="beats" id="beats"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <canvas id="cv"></canvas>
    <div class="controls">
      <button id="reset" title="止めて最初に戻す"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg>最初から</button>
      <button id="play" class="play" title="開始 / 一時停止">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg><span id="playLabel">開始</span>
      </button>
      <button id="reroll" title="譜面をランダムに作り直す"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>作り直す</button>
      <button id="far" title="全画面にして譜面を大きく出す。離れた所から見るとき用"><svg id="farIcon" viewBox="0 0 24 24"><path d="M5 5h6v2H7v4H5zM13 5h6v6h-2V7h-4zM5 13h2v4h4v2H5zM17 13h2v6h-6v-2h4z"/></svg><span id="farLabel">遠目</span></button>
    </div>
    <div class="farbar" id="farbar">
      <button id="farTap" title="曲の小節の頭(1拍目)で押すと、今を小節の頭に合わせる">Top</button>
      <label>表示 <select id="farView"><option value="4">4拍</option><option value="6" selected>6拍</option><option value="8">8拍</option></select></label>
    </div>
    <div class="settings">
      <label>BPM <input type="number" id="bpm" min="40" max="300" step="0.1" placeholder="130"></label>
      <span class="grp">
        <button id="tap" title="曲の小節の頭(1拍目)で押すと、今を小節の頭に合わせる">Top</button>
        <button id="offMinus" title="譜面を 0.05 秒戻す (ノーツが遅く来る)">−.05</button>
        <button id="offPlus" title="譜面を 0.05 秒進める (ノーツが早く来る)">＋.05</button>
        <button id="beatMinus" title="4拍戻る。止めて譜面を眺めるときや、頭が半小節ずれたときに">−4</button>
        <button id="beatPlus" title="4拍進む。止めて譜面を眺めるときや、頭が半小節ずれたときに">＋4</button>
      </span>
      <label>表示 <select id="view"><option value="8">8拍</option><option value="12">12拍</option><option value="16" selected>16拍</option><option value="24">24拍</option></select></label>
    </div>
    <div class="bpms" id="bpms" title="よく使う BPM"></div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---- クロック ----
  // 曲は再生しない。開始からの経過秒をページ内で数え、BPM と開始(offset)で拍に変換する。
  let playing = false, base = 0, startAt = 0;
  let raf = 0;
  const elapsed = () => playing ? base + (performance.now() - startAt) / 1000 : base;
  function setPlaying(p) {
    if (p === playing) return;
    if (p) { startAt = performance.now(); playing = true; if (!raf) raf = requestAnimationFrame(tick); }
    else { base = elapsed(); playing = false; }
    $('playIcon').innerHTML = p ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 5v14l12-7z"/>';
    $('playLabel').textContent = p ? '一時停止' : '開始';
    draw();
  }
  const togglePlay = () => setPlaying(!playing);
  function reset() {
    setPlaying(false);
    base = 0;
    sd.offset = 0;
    draw();
  }
  // 今を「今いる小節」の頭に合わせる (切り捨て。譜面は必ず戻る方向に動く)。止まっていれば開始もする
  function tap() {
    if (!sd.bpm) return;
    setPlaying(true);
    const e = elapsed();
    const bar = Math.max(0, Math.floor((e - sd.offset) / beatDur() / BAR));
    setOffset(e - bar * BAR * beatDur());
  }

  $('play').addEventListener('click', togglePlay);
  $('reset').addEventListener('click', reset);
  $('tap').addEventListener('click', tap);

  // ---- キーボード ----
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if ((e.code === 'Space' || e.key === 'Enter') && e.target.tagName === 'BUTTON') return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) togglePlay(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (!e.repeat) tap(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); shiftSec(-0.05); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); shiftSec(+0.05); }
  });

  // ---- 譜面生成 ----
  // ノーツ = 「位置 from から位置 to へ、len 拍で移動する。体の向きは facing」
  // 位置は横一列の 4 レーン (1..4)。前のノーツの to が次のノーツの from になる。
  // 1小節は 8 拍で、ノーツは小節をまたがない。拍数は 2 と 4 が基本、1 はアクセント、8 は大移動。
  // 移動距離: 1拍=0、2拍=0〜1、4拍=0〜2、8拍=0 か 3 レーン。
  const BAR = 8, LANES = 4;
  const FACING = {
    U: { color: '#1f5fbf' },
    L: { color: '#1f8a4c' },
    R: { color: '#d97706' },
  };
  const DIST_W = { 1: { 0: 1 }, 2: { 0: 0.4, 1: 0.6 }, 4: { 0: 0.2, 1: 0.4, 2: 0.4 }, 8: { 0: 0.3, 3: 0.7 } };
  const FACING_W = { U: 2, L: 1, R: 1 };

  // 8 拍の分け方を全列挙する。1 拍は 1 小節に 2 つまで、かつ連続させない (合計が 8 なので 1 拍の数は必ず偶数になる)
  function compositions(total, parts) {
    const out = [];
    (function rec(rem, acc) {
      if (rem === 0) { out.push(acc.slice()); return; }
      for (const p of parts) if (p <= rem) { acc.push(p); rec(rem - p, acc); acc.pop(); }
    })(total, []);
    return out;
  }
  const PATTERNS = compositions(BAR, [1, 2, 4, 8])
    .filter(p => p.filter(x => x === 1).length <= 2 && !p.some((x, i) => x === 1 && p[i + 1] === 1))
    .map(p => ({ parts: p, w: p.includes(1) ? 0.08 : p.length === 1 ? 0.5 : 1 }));

  const rnd = Math.random;
  const pick = a => a[Math.floor(rnd() * a.length)];
  function wpick(items, wf) {
    let tot = 0;
    for (const it of items) tot += wf(it);
    let r = rnd() * tot;
    for (const it of items) { r -= wf(it); if (r < 0) return it; }
    return items[items.length - 1];
  }

  // gen: 生成の引き継ぎ状態 { lane, facing, stayRun, facingRun }
  function newGen() { return { lane: 1 + Math.floor(rnd() * LANES), facing: 'U', stayRun: 0, facingRun: 0 }; }
  function genNote(len, gen) {
    const from = gen.lane;
    const dists = Object.keys(DIST_W[len]).map(Number).filter(d => from - d >= 1 || from + d <= LANES);
    // 留まるのが続いたら留まる確率を下げる (1 拍のアクセントは常に留まるので数えない)
    const dist = wpick(dists, d => DIST_W[len][d] * (d === 0 && gen.stayRun >= 1 ? 0.4 : 1));
    const to = dist === 0 ? from : pick([from - dist, from + dist].filter(l => l >= 1 && l <= LANES));
    // 体の向き。移動するノーツは正面か「移動先と逆」(後ろ向き) の二択で 1:1。移動先と同じ向きは出さない
    // 留まるノーツは ↑←→ のどれでもよく、同じ向きが 3 ノーツ続いたら変える
    let facing;
    if (to !== from) facing = pick(['U', to > from ? 'L' : 'R']);
    else {
      const facings = Object.keys(FACING_W).filter(f => !(gen.facingRun >= 2 && f === gen.facing));
      facing = wpick(facings, f => FACING_W[f] * (f === gen.facing ? 1.5 : 1));
    }
    gen.lane = to;
    if (len > 1) gen.stayRun = dist === 0 ? gen.stayRun + 1 : 0;
    gen.facingRun = facing === gen.facing ? gen.facingRun + 1 : 0;
    gen.facing = facing;
    return { len, from, to, facing };
  }
  function genBar(i, gen) {
    const notes = [];
    let b = i * BAR;
    for (const len of wpick(PATTERNS, p => p.w).parts) {
      const n = genNote(len, gen);
      n.beat = b;
      b += len;
      notes.push(n);
    }
    return notes;
  }
  // ---- 譜面生成ここまで ----

  // ---- 状態・設定 ----
  const sd = { bpm: 0, offset: 0, view: 16, farView: 6, far: false, bars: [], gen: newGen() };
  const els = { bpm: $('bpm'), view: $('view'), farView: $('farView'), status: $('stText'), beats: [...$('beats').children] };
  const barAt = i => { while (sd.bars.length <= i) sd.bars.push(genBar(sd.bars.length, sd.gen)); return sd.bars[i]; };
  const reroll = () => { sd.bars = []; sd.gen = newGen(); };
  const beatDur = () => 60 / sd.bpm;

  function setOffset(v) {
    sd.offset = +v || 0;
    draw();
  }
  function setBpm(v) {
    // 変更前の拍位置を保ったまま BPM を差し替える
    const e = elapsed();
    const nowBeat = sd.bpm > 0 ? (e - sd.offset) / beatDur() : 0;
    sd.bpm = Math.max(0, +v || 0);
    if (sd.bpm > 0) sd.offset = e - nowBeat * beatDur();
    els.bpm.value = sd.bpm || '';
    try { localStorage.setItem('sd:bpm', String(sd.bpm)); } catch {}
    renderBpmChips();
    draw();
  }
  els.bpm.addEventListener('change', () => setBpm(els.bpm.value));

  // ワンタップで入れる BPM の一覧。必要に応じてここを直接編集する
  const BPMS = [130, 132, 140, 143, 145, 148, 150, 155, 158, 160, 165, 170, 172, 175, 180, 185, 200, 205, 210, 225, 235, 240];
  const bpmsEl = $('bpms');
  for (const b of BPMS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = String(b);
    btn.dataset.bpm = String(b);
    btn.addEventListener('click', () => setBpm(b));
    bpmsEl.appendChild(btn);
  }
  function renderBpmChips() {
    for (const btn of bpmsEl.children) btn.classList.toggle('on', +btn.dataset.bpm === sd.bpm);
  }
  // 「−」は譜面が戻る (offset を増やす)、「＋」は進む (offset を減らす)
  const shiftSec = sec => setOffset(sd.offset - sec);
  const shiftBeats = beats => { if (sd.bpm) shiftSec(beats * beatDur()); };
  $('offMinus').addEventListener('click', () => shiftSec(-0.05));
  $('offPlus').addEventListener('click', () => shiftSec(+0.05));
  $('beatMinus').addEventListener('click', () => shiftBeats(-4));
  $('beatPlus').addEventListener('click', () => shiftBeats(+4));
  $('reroll').addEventListener('click', () => { reroll(); draw(); });
  try {
    sd.bpm = +localStorage.getItem('sd:bpm') || 0;
    sd.view = +localStorage.getItem('sd:view') || 16;
    sd.farView = +localStorage.getItem('sd:farView') || 6;
  } catch {}
  els.bpm.value = sd.bpm || '';
  renderBpmChips();
  els.view.value = String(sd.view);
  els.view.addEventListener('change', () => {
    sd.view = +els.view.value;
    try { localStorage.setItem('sd:view', String(sd.view)); } catch {}
    draw();
  });
  els.farView.value = String(sd.farView);
  els.farView.addEventListener('change', () => {
    sd.farView = +els.farView.value;
    try { localStorage.setItem('sd:farView', String(sd.farView)); } catch {}
    draw();
  });

  // ---- 遠目モード ----
  // 全画面にして譜面だけを出す。操作は画面をタップしたときだけ下に出し、しばらくすると引っ込む
  let uiTimer = 0;
  function showUi(on) {
    clearTimeout(uiTimer);
    document.body.classList.toggle('ui', on);
    if (on) uiTimer = setTimeout(() => document.body.classList.remove('ui'), 6000);
  }
  function setFar(on) {
    sd.far = on;
    document.body.classList.toggle('far', on);
    showUi(false);
    $('farLabel').textContent = on ? '戻る' : '遠目';
    if (on) { document.documentElement.requestFullscreen?.().catch(() => {}); }
    else if (document.fullscreenElement) { document.exitFullscreen?.().catch(() => {}); }
    draw();
  }
  $('far').addEventListener('click', () => setFar(!sd.far));
  $('farTap').addEventListener('click', () => { tap(); showUi(true); });
  // 端末の戻る操作や Esc で全画面が解けたら遠目も抜ける
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && sd.far) setFar(false); });
  $('cv').addEventListener('click', () => { if (sd.far) showUi(!document.body.classList.contains('ui')); });
  for (const id of ['play', 'reset', 'reroll']) $(id).addEventListener('click', () => { if (sd.far) showUi(true); });

  // ---- 描画 ----
  const cv = $('cv'), ctx = cv.getContext('2d');
  const C = { ink: '#1c2430', mute: '#6b7480', line: '#d5d9de', faint: '#e9ecef', paper: '#fafbfc', accent: '#1f5fbf' };
  const PAST = 2;         // 判定線より上(過ぎた側)に見せる拍数
  const HEAD = 44;        // 上部のレーン番号の高さ
  // 遠目モードでは先を短く、過ぎた側も狭くして 1 拍を大きく取る
  const past = () => sd.far ? 1 : PAST;
  const head = () => sd.far ? 72 : HEAD;
  const view = () => sd.far ? sd.farView : sd.view;
  let W = 0, H = 0, dpr = 1;

  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    draw();
  }
  new ResizeObserver(resize).observe(cv);

  function roundRect(x, y, w, h, r) {
    h = Math.max(h, 1);
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // 体の向き。○に付けた塗りの三角 (↑は○の上、←は左、→は右)
  // b0 は○の中心から三角の底辺までの距離、th は三角の高さ、tb は底辺の半分
  function drawFacing(cx, cy, facing, b0, th, tb) {
    ctx.beginPath();
    if (facing === 'U') { ctx.moveTo(cx, cy - b0 - th); ctx.lineTo(cx - tb, cy - b0); ctx.lineTo(cx + tb, cy - b0); }
    else {
      const d = facing === 'R' ? 1 : -1;
      ctx.moveTo(cx + d * (b0 + th), cy); ctx.lineTo(cx + d * b0, cy - tb); ctx.lineTo(cx + d * b0, cy + tb);
    }
    ctx.closePath(); ctx.fill();
  }

  function draw() {
    if (!W || !H) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);

    const far = sd.far, HEAD = head();
    const margin = far ? 36 : 30;    // 左余白は小節番号ぶんだけ
    const laneW = (W - margin - 10) / LANES;
    const laneX = l => margin + (l - 0.5) * laneW;
    const ppb = (H - HEAD) / (view() + past());
    const lineY = HEAD + past() * ppb;
    const ready = sd.bpm > 0;
    const nowBeat = ready ? (elapsed() - sd.offset) / beatDur() : 0;
    const yOf = b => lineY + (b - nowBeat) * ppb;

    // レーンの点線
    ctx.save();
    ctx.setLineDash([4, 6]); ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    for (let l = 1; l <= LANES; l++) { ctx.beginPath(); ctx.moveTo(laneX(l), HEAD); ctx.lineTo(laneX(l), H); ctx.stroke(); }
    ctx.restore();

    const bFrom = Math.floor(nowBeat - past()), bTo = Math.ceil(nowBeat + view());
    if (ready) {
      // 拍線・小節線
      ctx.font = `${far ? '700 20px' : '11px'} ` + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      for (let b = Math.max(0, bFrom); b <= bTo; b++) {
        const y = yOf(b);
        if (y < HEAD || y > H) continue;
        const head = b % BAR === 0;
        ctx.strokeStyle = head ? C.line : C.faint; ctx.lineWidth = head ? 2 : 1;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        if (head) { ctx.fillStyle = C.mute; ctx.fillText(`${b / BAR + 1}`, 6, y - 3); }
      }
      // ノーツ
      const i0 = Math.max(0, Math.floor(bFrom / BAR)), i1 = Math.max(0, Math.floor(bTo / BAR));
      for (let i = i0; i <= i1; i++) for (const n of barAt(i)) drawNote(n, yOf, ppb, laneX, laneW, nowBeat);
    }

    // 過ぎた側を薄くする
    ctx.fillStyle = 'rgba(250,251,252,0.65)'; ctx.fillRect(0, HEAD, W, lineY - HEAD);
    // 判定線
    ctx.strokeStyle = C.ink; ctx.lineWidth = far ? 5 : 3;
    ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(W, lineY); ctx.stroke();

    // 上部のレーン番号。今のノーツの移動先を強調
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, HEAD);
    const cur = ready ? currentNote(nowBeat) : null;
    ctx.font = `700 ${far ? 40 : 18}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let l = 1; l <= LANES; l++) {
      const on = cur && cur.to === l;
      const bw = Math.min(laneW - 8, far ? 96 : 64);
      roundRect(laneX(l) - bw / 2, 6, bw, HEAD - 12, far ? 12 : 9);
      ctx.fillStyle = on ? FACING[cur.facing].color : '#fff'; ctx.fill();
      ctx.strokeStyle = on ? FACING[cur.facing].color : C.line; ctx.lineWidth = far ? 2.5 : 1.5; ctx.stroke();
      ctx.fillStyle = on ? '#fff' : C.ink; ctx.fillText(String(l), laneX(l), HEAD / 2);
    }

    // ステータス
    const state = playing ? '' : '（停止中）';
    if (!ready) {
      els.status.textContent = 'BPM を入力してください';
      els.beats.forEach(e => e.classList.remove('on'));
    } else if (nowBeat < 0) {
      els.status.textContent = `BPM ${sd.bpm} / 開始まで ${(-nowBeat * beatDur()).toFixed(1)} 秒${state}`;
      els.beats.forEach(e => e.classList.remove('on'));
    } else {
      const beat = Math.floor(nowBeat) % BAR;
      els.status.textContent = `BPM ${sd.bpm} / ${Math.floor(nowBeat / BAR) + 1} 小節目${state}`;
      els.beats.forEach((e, k) => e.classList.toggle('on', k === beat));
    }
  }

  function currentNote(nowBeat) {
    if (nowBeat < 0) return null;
    for (const n of barAt(Math.floor(nowBeat / BAR))) if (nowBeat >= n.beat && nowBeat < n.beat + n.len) return n;
    return null;
  }

  function drawNote(n, yOf, ppb, laneX, laneW, nowBeat) {
    const y0 = yOf(n.beat), y1 = yOf(n.beat + n.len);
    if (y1 < HEAD || y0 > H) return;
    const col = FACING[n.facing].color;
    const active = nowBeat >= n.beat && nowBeat < n.beat + n.len;
    const lo = Math.min(n.from, n.to), hi = Math.max(n.from, n.to);
    const far = sd.far;
    const x0 = laneX(lo) - laneW / 2 + 3, x1 = laneX(hi) + laneW / 2 - 3;
    const gap = far ? 3 : 2;

    // ブロック。遠目では薄い色が消えて見えるので全部濃く塗り、今のノーツは白い太枠で区別する
    roundRect(x0, y0 + gap, x1 - x0, y1 - y0 - gap * 2, far ? 14 : 10);
    ctx.fillStyle = active || far ? col : col + '22'; ctx.fill();
    if (far) {
      ctx.strokeStyle = active ? '#fff' : col; ctx.lineWidth = active ? 6 : 2;
    } else {
      ctx.strokeStyle = col; ctx.lineWidth = active ? 3 : 2;
    }
    ctx.stroke();

    // 記号の行: ○が開始位置、○に付いた塗りの三角が体の向き、○から伸びる線の先が移動先
    // 行はブロックの上寄り (長いノーツでも頭に近い所に出す)。遠目では上限を外して大きくする
    // 三角は○の半径 r 比で、高さ TH・底辺の半分 TB。線の太さは r の 0.3
    const TH = 0.85, TB = 0.85;
    const rMin = far ? 14 : 5;
    let r = far ? Math.min(laneW * 0.3, ppb * 0.32, 44) : Math.min(laneW * 0.22, ppb * 0.38, 16);
    // 横: 三角の先がブロックの横幅から出ないように (r + 線幅 0.3r + 三角 TH·r)
    r = Math.min(r, (laneW / 2 - 5) / (1.3 + TH));
    // 縦: ↑の三角を載せた全体 (2r + 線幅 0.45r + 三角 TH·r + 余白) が収まらない短いノーツでは縮める
    r = Math.max(rMin, Math.min(r, (y1 - y0 - gap * 2 - 4) / (2.45 + TH)));
    const lw = Math.max(2.5, r * 0.3), th = r * TH, tb = r * TB, b0 = r + lw;
    // 行の位置: 上寄り。ただし↑の三角が上辺を越えない所まで下げ、短いノーツでは三角ごと中央に
    const minGy = gap + 2 + th + b0;
    const gy = y0 + Math.min((y1 - y0 + th + lw / 2) / 2, Math.max(far ? 0.9 * ppb : 1.25 * ppb, minGy));
    const ink = active || far ? '#fff' : col;
    const cx = laneX(n.from);
    if (n.to !== n.from) {
      ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, gy); ctx.lineTo(laneX(n.to), gy); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, gy, r, 0, Math.PI * 2);
    ctx.fillStyle = active || far ? col : '#fff'; ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.stroke();
    ctx.fillStyle = ink;
    if (n.to === n.from) { ctx.beginPath(); ctx.arc(cx, gy, r * 0.35, 0, Math.PI * 2); ctx.fill(); }
    drawFacing(cx, gy, n.facing, b0, th, tb);
  }

  // 動いている間は毎フレーム追従する
  function tick() { draw(); raf = playing ? requestAnimationFrame(tick) : 0; }
})();
</script>
</body>
</html>
